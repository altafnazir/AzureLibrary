# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  projectName: 'DummyAPI'
  appName: 'azurewebapplearning'
  deployToSlotOrASE: false
  resourceGroupName: 'learnazure'
  slotName: 'mystaging'

steps:

- task: DotNetCoreCLI@2
  inputs:
    azureSubscription: 'Pay-As-You-Go(886ab17f-b344-4db5-9b16-d7768b64f994)'
    command: 'publish'
    publishWebProjects: false
    projects: '**/$(projectName).csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/$(projectName)'
    zipAfterPublish: false
    modifyOutputPath: false


- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/$(projectName)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(projectName).zip'
    replaceExistingArchive: true

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Pay-As-You-Go(886ab17f-b344-4db5-9b16-d7768b64f994)'
    appType: 'webApp'
    appName: '$(appName)'
    package: '$(Build.ArtifactStagingDirectory)/$(projectName).zip'
    deploymentMethod: 'auto'

    ${{ if eq(variables.deployToSlotOrASE, true) }}:
      deployToSlotOrASE: true
      resourceGroupName: '$(resourceGroupName)'
      slotName: '$(slotName)'

    ${{ if eq(variables.deployToSlotOrASE, false) }}:
      deployToSlotOrASE: false

