# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  apiProject: 'DummyAPI'

steps:

- task: DotNetCoreCLI@2
  inputs:
    azureSubscription: 'Pay-As-You-Go(886ab17f-b344-4db5-9b16-d7768b64f994)'
    command: 'publish'
    publishWebProjects: false
    projects: '**/$(apiProject).csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/$(apiProject)'
    zipAfterPublish: false
    modifyOutputPath: false


- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/$(apiProject)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(apiProject).zip'
    replaceExistingArchive: true

- powershell: |
    Write-Host "ZIP files:"
    Get-ChildItem "$(Build.ArtifactStagingDirectory)" -Recurse |
      ForEach-Object { Write-Host $_.FullName }
  displayName: 'Check deployment files'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Pay-As-You-Go(886ab17f-b344-4db5-9b16-d7768b64f994)'
    appType: 'webApp'
    appName: 'azurewebapplearning'
    package: '$(Build.ArtifactStagingDirectory)/$(apiProject).zip'
    deploymentMethod: 'zipDeploy'